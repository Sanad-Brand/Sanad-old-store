<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سَـنَدْ | Sanad - للأزياء الراقية</title>
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة الأنيميشن المتقدمة AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@400;700;800&display=swap');

        :root {
            --primary: #111;
            --gold: #d4af37;
            --light: #f9f9f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--light); color: var(--primary); overflow-x: hidden; }

        /* شاشة التحميل الحركية */
        .loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--primary); display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s ease;
        }
        .loader h1 { font-family: 'Reem Kufi', sans-serif; color: var(--gold); font-size: 4rem; animation: logoBounce 1.2s infinite alternate; letter-spacing: 3px; }
        @keyframes logoBounce { 0% { transform: scale(0.9); text-shadow: 0 0 10px rgba(212,175,55,0.3); } 100% { transform: scale(1.1); text-shadow: 0 0 30px rgba(212,175,55,0.8); } }

        /* الهيدر المتحرك */
        header {
            position: fixed; top: 0; width: 100%; padding: 15px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.08); z-index: 1000;
            animation: slideDown 0.8s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

        .logo { 
            font-family: 'Reem Kufi', sans-serif; font-size: 2.3rem; font-weight: 700; 
            color: var(--primary); text-decoration: none; cursor: pointer; letter-spacing: 1px;
            animation: pulseGlow 3s infinite alternate;
        }
        .logo span { color: var(--gold); }
        @keyframes pulseGlow { 0% { text-shadow: 0 0 5px rgba(212,175,55,0.2); } 100% { text-shadow: 0 0 15px rgba(212,175,55,0.7); } }

        .header-icons { display: flex; gap: 20px; align-items: center; }
        .admin-icon { font-size: 1.5rem; cursor: pointer; color: var(--primary); transition: 0.4s; }
        .admin-icon:hover { color: var(--gold); transform: rotate(180deg) scale(1.2); }

        /* الهيرو المتحرك والحيّ */
        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?auto=format&fit=crop&w=1920&q=80') center/cover;
            color: white; padding: 0 20px; position: relative; overflow: hidden;
        }
        .hero-content {
            animation: heroFloat 3s ease-in-out infinite alternate;
        }
        @keyframes heroFloat { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }
        
        .hero h1 { font-family: 'Reem Kufi', sans-serif; font-size: 4.5rem; margin-bottom: 20px; color: #fff; }
        .hero h1 span { color: var(--gold); }
        .hero p { font-size: 1.5rem; margin-bottom: 30px; color: #ddd; }
        
        .btn {
            padding: 15px 40px; background: var(--gold); color: white; text-decoration: none;
            font-size: 1.2rem; font-weight: bold; border-radius: 30px; transition: 0.4s; display: inline-block;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }
        .btn:hover { transform: translateY(-8px) scale(1.08); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.7); }

        /* الأقسام */
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* المنتجات مع حركة مكثفة */
        .products { padding: 110px 5% 70px; text-align: center; overflow: hidden; }
        .section-title { font-size: 2.8rem; margin-bottom: 60px; font-weight: 800; font-family: 'Reem Kufi', sans-serif; }
        .section-title span { color: var(--gold); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 35px; }
        
        .card { 
            background: white; border-radius: 18px; overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.06); transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); text-align: right; 
            cursor: pointer; border: 1px solid #eee; position: relative;
        }
        .card:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 25px 50px rgba(0,0,0,0.15); border-color: var(--gold); }
        
        .img-container { height: 350px; overflow: hidden; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .card:hover img { transform: scale(1.15) rotate(1deg); }
        
        .card-body { padding: 25px; }
        .card-body h3 { font-size: 1.35rem; margin-bottom: 8px; color: var(--primary); transition: 0.3s; }
        .card:hover .card-body h3 { color: var(--gold); }
        
        .product-desc { color: #666; font-size: 0.92rem; margin: 10px 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price { color: var(--gold); font-size: 1.3rem; font-weight: 800; margin: 15px 0; }
        
        .details-link-btn {
            background: var(--primary); color: white; border: none; padding: 12px; width: 100%;
            border-radius: 8px; cursor: pointer; font-size: 1.05rem; transition: 0.4s; font-family: 'Tajawal'; font-weight: bold; text-align: center; display: block; text-decoration: none;
        }
        .details-link-btn:hover { background: var(--gold); letter-spacing: 1px; }

        /* صفحة تفاصيل المنتج المستقلة */
        .product-details-page { padding: 120px 8% 80px; background: #fff; min-height: 100vh; animation: fadeInPage 0.5s ease; }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            background: #eee; color: var(--primary); border: none; padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-size: 1rem; font-weight: bold; margin-bottom: 30px; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: var(--gold); color: white; transform: translateX(5px); }

        .details-container { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
        @media(max-width: 900px) { .details-container { grid-template-columns: 1fr; } }

        .details-img-box { height: 500px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); animation: zoomInImg 0.8s ease; }
        @keyframes zoomInImg { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .details-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .details-img-box img:hover { transform: scale(1.05); }
        
        .details-info-box h1 { font-size: 2.5rem; margin-bottom: 15px; font-family: 'Reem Kufi', sans-serif; }
        .details-info-box .price-tag { color: var(--gold); font-size: 2rem; font-weight: 800; margin-bottom: 20px; }
        .details-info-box .desc-text { color: #555; font-size: 1.1rem; line-height: 1.8; margin-bottom: 30px; background: #fdfdfd; padding: 20px; border-radius: 10px; border: 1px solid #eee; }

        .direct-checkout-box { background: #f9f9f9; padding: 25px; border-radius: 15px; border: 1px solid #ddd; animation: slideUpBox 0.6s ease; }
        @keyframes slideUpBox { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .direct-checkout-box h3 { margin-bottom: 15px; font-size: 1.3rem; }
        .direct-checkout-box input, .direct-checkout-box textarea {
            width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Tajawal'; background: #fff; transition: 0.3s;
        }
        .direct-checkout-box input:focus, .direct-checkout-box textarea:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,175,55,0.3); outline: none; }

        .bill-summary { font-size: 0.95rem; margin-bottom: 15px; background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        .bill-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .total-row { font-weight: bold; color: var(--primary); border-top: 1px dashed #ddd; padding-top: 6px; margin-top: 4px; font-size: 1.1rem; }

        .whatsapp-order-btn {
            width: 100%; padding: 14px; background: #25D366; color: white; border: none;
            border-radius: 8px; font-size: 1.15rem; font-weight: bold; cursor: pointer; font-family: 'Tajawal'; transition: 0.4s;
        }
        .whatsapp-order-btn:hover { background: #1ebc57; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 211, 102, 0.4); }

        /* لوحة التحكم ونافذة الباسورد */
        .admin-modal {
            position: fixed; top: 0; right: -100%; width: 420px; height: 100vh;
            background: white; box-shadow: -2px 0 25px rgba(0,0,0,0.2);
            z-index: 1002; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1); padding: 25px; overflow-y: auto; text-align: right;
        }
        .admin-modal.active { right: 0; }
        .close-admin { font-size: 1.6rem; cursor: pointer; color: var(--primary); float: left; margin-bottom: 20px; transition: 0.3s; }
        .close-admin:hover { color: red; transform: rotate(90deg); }

        .admin-form input, .admin-form textarea {
            width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Tajawal';
        }
        .admin-btn {
            width: 100%; padding: 13px; background: var(--gold); color: white; border: none;
            border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; font-family: 'Tajawal'; margin-bottom: 20px; transition: 0.3s;
        }
        .admin-btn:hover { background: #b8972b; transform: scale(1.02); }

        .admin-product-item {
            display: flex; justify-content: space-between; align-items: center; background: #f5f5f5;
            padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.95rem; transition: 0.3s;
        }
        .admin-product-item:hover { background: #eee; }
        .delete-prod-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .delete-prod-btn:hover { background: #cc0000; transform: scale(1.1); }

        .password-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 3000; display: none; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .password-modal.active { display: flex; }
        .password-box {
            background: white; padding: 30px; border-radius: 15px; width: 320px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            animation: scaleUp 0.3s ease;
        }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .password-box h3 { margin-bottom: 15px; color: var(--primary); }
        .password-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 1.2rem; }
        .password-box button { padding: 10px 20px; background: var(--gold); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.3s; }
        .password-box button:hover { opacity: 0.9; transform: scale(1.02); }

        /* رسالة الإشعار الأنيقة */
        .toast-notification {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background-color: var(--primary); color: white; padding: 14px 28px;
            border-radius: 30px; font-size: 1.05rem; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            z-index: 10000; transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; gap: 12px; border: 1px solid var(--gold);
        }
        .toast-notification.show { bottom: 35px; }
        .toast-notification i { color: var(--gold); font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="loader" id="loader"><h1>سَـنَدْ</h1></div>

    <header>
        <a href="#" class="logo" onclick="showHome()">سَـنَدْ <span>للأزياء</span></a>
        <div class="header-icons">
            <div class="admin-icon" onclick="showPasswordModal()" title="لوحة التحكم"><i class="fas fa-cog"></i></div>
        </div>
    </header>

    <!-- نافذة كلمة المرور -->
    <div class="password-modal" id="password-modal">
        <div class="password-box">
            <h3>تسجيل دخول الإدارة</h3>
            <input type="password" id="admin-pass-input" placeholder="الرقم السري">
            <button onclick="verifyAdminPassword()">دخول</button>
            <button onclick="closePasswordModal()" style="background: #ccc; color: #333; margin-top: 8px;">إلغاء</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-modal" id="admin-modal">
        <i class="fas fa-times close-admin" onclick="openAdmin()"></i>
        <h2 style="margin-bottom: 20px; font-family: 'Reem Kufi';">لوحة تحكم سَـنَدْ</h2>
        <div class="admin-form">
            <h3>إضافة منتج جديد:</h3>
            <input type="text" id="p-name" placeholder="اسم المنتج">
            <input type="text" id="p-price" placeholder="السعر (أرقام فقط)">
            <input type="text" id="p-img" placeholder="رابط صورة المنتج (URL)">
            <textarea id="p-desc" rows="3" placeholder="وصف وتفاصيل المنتج"></textarea>
            <button class="admin-btn" onclick="addNewProduct()">إضافة المنتج للموقع</button>
        </div>
        <hr style="margin: 20px 0;">
        <h3>المنتجات الحالية:</h3>
        <div id="admin-products-list" style="margin-top: 10px;"></div>
    </div>

    <!-- الإشعار -->
    <div id="custom-toast" class="toast-notification">
        <i class="fas fa-check-circle"></i> <span id="toast-message">تمت العملية!</span>
    </div>

    <!-- ================= الصفحة الرئيسية ================= -->
    <div id="home-page" class="page-section active">
        <section class="hero">
            <div class="hero-content" data-aos="zoom-in" data-aos-duration="1200" data-aos-mirror="true" data-aos-once="false">
                <h1>أناقة تليق بـ <span>سَـنَدْ</span></h1>
                <p>اكتشف أحدث صيحات الموضة والأزياء الراقية</p>
                <a href="#products" class="btn">تسوق الآن</a>
            </div>
        </section>

        <section class="products" id="products">
            <h2 class="section-title" data-aos="fade-down" data-aos-duration="1000" data-aos-mirror="true" data-aos-once="false">أحدث <span>المنتجات</span></h2>
            <div class="grid" id="products-grid"></div>
        </section>
    </div>

    <!-- ================= صفحة تفاصيل المنتج ================= -->
    <div id="details-page" class="page-section product-details-page">
        <button class="back-btn" onclick="showHome()"><i class="fas fa-arrow-right"></i> العودة للرئيسية</button>
        
        <div class="details-container">
            <div class="details-img-box">
                <img id="d-page-img" src="" alt="صورة المنتج">
            </div>
            
            <div class="details-info-box">
                <h1 id="d-page-title"></h1>
                <div class="price-tag" id="d-page-price"></div>
                <p class="desc-text" id="d-page-desc"></p>
                
                <div class="direct-checkout-box">
                    <h3>اطلب المنتج الآن</h3>
                    <div class="bill-summary">
                        <div class="bill-row"><span>سعر المنتج:</span> <span id="d-subtotal">0 ج.م</span></div>
                        <div class="bill-row"><span>مصاريف التوصيل:</span> <span>50 ج.م</span></div>
                        <div class="bill-row total-row"><span>الإجمالي النهائي:</span> <span id="d-final-total">50 ج.م</span></div>
                    </div>

                    <input type="text" id="d-name" placeholder="الاسم بالكامل" required>
                    <input type="text" id="d-phone" placeholder="رقم الموبايل" required>
                    <textarea id="d-address" rows="3" placeholder="العنوان بالتفصيل" required></textarea>
                    
                    <button class="whatsapp-order-btn" onclick="sendDirectOrderToWhatsApp()">
                        <i class="fab fa-whatsapp"></i> إتمام الطلب عبر الواتساب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        window.addEventListener('load', () => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                // تفعيل خاصية mirror: true عشان الأنيميشن يتعد كل ما تطلع وتنزل في الموقع!
                AOS.init({ 
                    once: false, 
                    mirror: true, 
                    offset: 80,
                    duration: 1000
                });
            }, 500);
        });

        let products = JSON.parse(localStorage.getItem('sanad_products')) || [
            { id: 1, name: "جاكيت كلاسيك شتوي", price: 1200, img: "https://images.unsplash.com/photo-1516762689617-e1cffcef479d", desc: "جاكيت مبطن بخامات عالمية عالية الجودة، مصمم خصيصاً ليمنحك دفء وأناقة فائقة خلال الأيام الباردة." },
            { id: 2, name: "هودي سَـنَدْ المميز", price: 650, img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7", desc: "هودي قطن ميلتون 100% بتصميم عصري مريح وطباعة رقمية فاخرة ثابتة لا تتأثر بالغسيل المتكرر." },
            { id: 3, name: "تيشيرت بيزك قطن", price: 350, img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab", desc: "تيشيرت أساسي ناعم وخفيف، خامات قطنية مصرية خالصة توفر لك أقصى درجات الراحة في اللبس اليومي." }
        ];

        let currentActiveProduct = null;
        const shippingFee = 50;

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const adminList = document.getElementById('admin-products-list');
            grid.innerHTML = '';
            adminList.innerHTML = '';

            products.forEach((prod, index) => {
                // حركات مكثفة ومتنوعة (يمن، يسار، تكبير، دوران خفيف) عشان السايت "يلعب" قدام العميل
                let animations = ['fade-right', 'fade-left', 'zoom-in-up', 'flip-left'];
                let chosenAnim = animations[index % animations.length];

                grid.innerHTML += `
                    <div class="card" data-aos="${chosenAnim}" data-aos-duration="1000" onclick="openProductDetails(${prod.id})">
                        <div class="img-container"><img src="${prod.img}" alt="${prod.name}"></div>
                        <div class="card-body">
                            <h3>${prod.name}</h3>
                            <p class="product-desc">${prod.desc}</p>
                            <div class="price">${prod.price} ج.م</div>
                            <span class="details-link-btn">عرض التفاصيل والطلب <i class="fas fa-chevron-left"></i></span>
                        </div>
                    </div>
                `;

                adminList.innerHTML += `
                    <div class="admin-product-item">
                        <span>${prod.name} (${prod.price} ج.م)</span>
                        <button class="delete-prod-btn" onclick="deleteProduct(${index})">حذف</button>
                    </div>
                `;
            });
            
            // تحديث الأنيميشن بعد رسم المنتجات
            setTimeout(() => { AOS.refresh(); }, 100);
        }

        renderProducts();

        function openProductDetails(id) {
            let prod = products.find(p => p.id === id);
            if(!prod) return;

            currentActiveProduct = prod;

            document.getElementById('d-page-img').src = prod.img;
            document.getElementById('d-page-title').innerText = prod.name;
            document.getElementById('d-page-price').innerText = `${prod.price} ج.م`;
            document.getElementById('d-page-desc').innerText = prod.desc;

            document.getElementById('d-subtotal').innerText = `${prod.price} ج.م`;
            document.getElementById('d-final-total').innerText = `${prod.price + shippingFee} ج.م`;

            document.getElementById('home-page').classList.remove('active');
            document.getElementById('details-page').classList.add('active');
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('details-page').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
            window.scrollTo(0, 0);
            setTimeout(() => { AOS.refresh(); }, 100);
        }

        function sendDirectOrderToWhatsApp() {
            let name = document.getElementById('d-name').value;
            let phone = document.getElementById('d-phone').value;
            let address = document.getElementById('d-address').value;

            if(!name || !phone || !address || !currentActiveProduct) {
                showToast("⚠️ يرجى إدخال جميع بيانات التوصيل بدقة!");
                return;
            }

            let finalTotal = currentActiveProduct.price + shippingFee;

            let orderText = `*أوردر جديد من متجر سَـنَدْ*%0A%0A`;
            orderText += `*اسم العميل:* ${name}%0A`;
            orderText += `*رقم الموبايل:* ${phone}%0A`;
            orderText += `*العنوان:* ${address}%0A%0A`;
            orderText += `*المنتج المطلوبة:*%0A`;
            orderText += `- ${currentActiveProduct.name} (${currentActiveProduct.price} ج.م)%0A%0A`;
            orderText += `*سعر المنتج:* ${currentActiveProduct.price} ج.م%0A`;
            orderText += `*مصاريف التوصيل:* ${shippingFee} ج.م%0A`;
            orderText += `*الإجمالي النهائي:* ${finalTotal} ج.م`;

            let storeWhatsAppNumber = "201080629789"; 
            let whatsappURL = `https://wa.me/${storeWhatsAppNumber}?text=${orderText}`;
            window.open(whatsappURL, '_blank');
        }

        function showPasswordModal() {
            document.getElementById('password-modal').classList.add('active');
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('admin-pass-input').focus();
        }

        function closePasswordModal() {
            document.getElementById('password-modal').classList.remove('active');
        }

        function verifyAdminPassword() {
            let pass = document.getElementById('admin-pass-input').value;
            if(pass === "1234") {
                closePasswordModal();
                document.getElementById('admin-modal').classList.toggle('active');
            } else {
                showToast("❌ كلمة المرور غير صحيحة!");
            }
        }

        function openAdmin() {
            document.getElementById('admin-modal').classList.toggle('active');
        }

        function showToast(message) {
            const toast = document.getElementById('custom-toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function addNewProduct() {
            let name = document.getElementById('p-name-input') || document.getElementById('p-name');
            let priceInput = document.getElementById('p-price');
            let imgInput = document.getElementById('p-img');
            let descInput = document.getElementById('p-desc');

            let nameVal = name.value;
            let priceVal = Number(priceInput.value);
            let imgVal = imgInput.value;
            let descVal = descInput.value;

            if(!nameVal || !priceVal || !imgVal) {
                alert("يرجى إكمال بيانات المنتج الأساسية (الاسم، السعر، ورابط الصورة)!");
                return;
            }

            products.push({ id: Date.now(), name: nameVal, price: priceVal, img: imgVal, desc: descVal || "تصميم أنيق ومميز من سَـنَدْ." });
            localStorage.setItem('sanad_products', JSON.stringify(products));
            renderProducts();

            name.value = '';
            priceInput.value = '';
            imgInput.value = '';
            descInput.value = '';

            showToast("✅ تمت إضافة المنتج للموقع بنجاح!");
        }

        function deleteProduct(index) {
            if(confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products.splice(index, 1);
                localStorage.setItem('sanad_products', JSON.stringify(products));
                renderProducts();
                showToast("🗑️ تم حذف المنتج!");
            }
        }
    </script>
</body>
</html>
